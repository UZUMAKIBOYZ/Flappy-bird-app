name: Build Flappy Bird APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake

      - name: Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Configure Buildozer
        working-directory: flappy bird
        run: |
          if grep -q "^android.accept_sdk_license" buildozer.spec; then
            sed -i 's/^android.accept_sdk_license.*/android.accept_sdk_license = True/' buildozer.spec
          else
            echo "android.accept_sdk_license = True" >> buildozer.spec
          fi

      - name: Prepare Android SDK
        working-directory: flappy bird
        run: |
          mkdir -p .buildozer/android/platform
          buildozer android debug || true

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          if [ -d "$SDK/tools/bin" ]; then
            yes | "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" --licenses || true
          elif [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses || true
          fi

      - name: Build APK
        working-directory: flappy bird
        run: |
          buildozer -v android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flappy-bird-apk
          path: "flappy bird/bin/*.apk"
